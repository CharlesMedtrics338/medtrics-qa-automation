[pytest]
# medtrics-qa-automation — pytest configuration
#
# Tests live alongside the skill that owns them, under skills/<name>/tests/.
# The plugin-root conftest.py adds every skills/*/scripts/ (and lib/) to
# sys.path once at collection time, so individual test files import directly
# (`import parse_checklist_steps as P`) with no boilerplate.

testpaths = skills
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Treat warnings as test failures so accidental DeprecationWarnings surface.
filterwarnings =
    error
    ignore::DeprecationWarning:pytest.*

# Show the slowest 5 tests + a short traceback on failure.
addopts = -ra --tb=short --durations=5

# Ignore generated artifacts and non-test directories under each skill.
norecursedirs =
    __pycache__
    .git
    outputs
    scripts
    templates
    references
    commands
    fixtures
